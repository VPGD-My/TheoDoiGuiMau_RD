name: Backup Supabase hằng tuần

on:
  schedule:
    - cron: "0 18 * * 0"   # 01:00 sáng thứ Hai giờ Việt Nam (18:00 UTC Chủ nhật)
  workflow_dispatch:        # cho phép chạy tay từ tab Actions

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cài pg_dump 17 (từ kho chính thức PostgreSQL)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Xuất dữ liệu schema public
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "Thiếu secret SUPABASE_DB_URL"; exit 1; }
          TS=$(date -u +%Y%m%d-%H%M)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --schema=public --format=custom --no-owner --no-privileges \
            --file "dtrg-backup-$TS.dump"
          # Kiểm tra file dump đọc được (kiểm tra khôi phục đầy đủ: xem README)
          /usr/lib/postgresql/17/bin/pg_restore --list "dtrg-backup-$TS.dump" > restore-list.txt
          echo "Số đối tượng trong bản sao lưu: $(grep -vc '^;' restore-list.txt)"
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: Mã hóa bản sao lưu (AES-256)
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASS" || { echo "Thiếu secret BACKUP_PASSPHRASE"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              --symmetric --cipher-algo AES256 \
              -o "dtrg-backup-$TS.dump.gpg" "dtrg-backup-$TS.dump"
          rm -f "dtrg-backup-$TS.dump"

      - name: Lưu bản sao lưu (giữ 90 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: dtrg-backup-${{ env.TS }}
          path: dtrg-backup-${{ env.TS }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
