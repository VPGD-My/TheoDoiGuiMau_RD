<!doctype html>
<html lang="vi" data-bg="6" data-turn="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo dõi gửi mẫu – DTRG</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --green:#119303;--green-dark:#0C6602;--green-light:#A6D99F;--green-tint:#E6F4E4;--green-wash:#F4FAF3;
  --ink-soft:#3A3B3D;--line:#D3D4D6;--line-soft:#DDE0E2;
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-alt:#F1F2F2;--text:#1F2022;--muted:#727376;--accent:#0C6602;--accent-strong:#119303;--pill-rd:#3A3B3D;
  --warn-bg:#FFF4E0;--warn:#8A4B00;--danger:#A32D2D;--danger-bg:#FCEBEB;
  --font:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F2022;--surface:#2A2B2E;--surface-alt:#333438;--text:#FFFFFF;--muted:#B9BABD;--line:#46474B;--line-soft:#3C3D41;--pill-rd:#FFFFFF;
  --accent:#A6D99F;--accent-strong:#A6D99F;--green-tint:#22361F;--green-wash:#252A24;--warn-bg:#3A2E16;--warn:#F2C879;--danger:#F09595;--danger-bg:#3A2020;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F2022;--surface:#2A2B2E;--surface-alt:#333438;--text:#FFFFFF;--muted:#B9BABD;--line:#46474B;--line-soft:#3C3D41;--pill-rd:#FFFFFF;
  --accent:#A6D99F;--accent-strong:#A6D99F;--green-tint:#22361F;--green-wash:#252A24;--warn-bg:#3A2E16;--warn:#F2C879;--danger:#F09595;--danger-bg:#3A2020;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0 14px;border-bottom:6px solid var(--green)}
.logo{background:#fff;border-radius:8px;padding:6px 10px;display:inline-flex}
.logo img{height:30px;width:auto;display:block}
header h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.grow{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who img{width:30px;height:30px;border-radius:50%}
.who b{display:block;font-weight:600}
.tabs{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green-dark);color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.primary{background:var(--green-dark);border-color:var(--green-dark);color:#fff;font-weight:600}
.btn.primary:hover{background:#0a5502}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.flow{margin:18px 0 6px;overflow-x:auto;padding-bottom:6px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(10,minmax(98px,1fr));min-width:1080px}
.flow li button{width:100%;text-align:left;background:transparent;border:0;border-top:4px solid var(--line);padding:10px 10px 8px}
.flow .pct{font-weight:800;font-size:18px}
.flow .nm{display:block;font-size:12px;color:var(--muted);line-height:1.3;min-height:32px}
.flow .ct{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-alt);color:var(--pill-rd)}
.flow .avg{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.flow li button.has{border-top-color:var(--green)}
.flow li button.has .ct{background:var(--green-tint);color:var(--accent)}
.flow li button.plan{border-top-style:dashed}
.flow li button.sel,.flow li button:hover{background:var(--green-wash)}
.flow li button.sel .pct{color:var(--accent-strong)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search],.tools select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tools input[type=search]{flex:1;min-width:200px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:36px 2fr 1.4fr 1.8fr 1fr 1.2fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-soft)}
.row.head{border-top:0;background:var(--surface-alt);font-size:12px;font-weight:600;color:var(--muted);padding:9px 14px}
.row.item{cursor:pointer}
.row.item:hover{background:var(--green-wash)}
.no{color:var(--muted);font-weight:600}
.cust b{display:block;font-weight:600}
.small{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green)}
.tn{font-weight:700;color:var(--accent);margin-right:4px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.d-KD{background:var(--green-tint);color:var(--accent)}
.d-RD{background:var(--surface-alt);color:var(--pill-rd)}
.d-KH{background:transparent;color:var(--accent);border:1px dashed var(--accent-strong)}
.flag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;margin:2px 4px 0 0}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.bad{background:var(--danger-bg);color:var(--danger)}
.flag.ok{background:var(--green-tint);color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-alt);padding:8px 10px}
.tbl td{padding:9px 10px;border-top:1px solid var(--line-soft);vertical-align:top}
.tbl tr.stephead td{background:var(--green-wash);font-weight:700;border-top:1px solid var(--line)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
@media (max-width:820px){.row.head{display:none}.row{grid-template-columns:1fr 1fr;gap:6px 12px}.no{display:none}.cust{grid-column:1/-1}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:21;overflow-y:auto;border-left:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 40px)}
.drawer h2{font-size:20px;font-weight:800;margin:0 0 2px}
.drawer h3{font-size:14px;font-weight:700;margin:22px 0 10px;color:var(--accent-strong);display:flex;align-items:center;gap:8px}
.dtop{display:flex;align-items:flex-start;gap:12px}
.x{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.stepper{display:flex;gap:3px;margin:14px 0 4px}
.stepper i{flex:1;height:6px;border-radius:2px;background:var(--surface-alt)}
.stepper i.done{background:var(--green)}
.stepper i.cur{background:var(--green-light);outline:1px solid var(--green)}
.cur-step{background:var(--green-wash);border:1px solid var(--line);border-radius:10px;padding:14px}
.cur-step .t{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.task{padding:12px 0;border-top:1px solid var(--line)}
.task-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.num{display:inline-flex;min-width:22px;height:22px;border-radius:11px;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.num.ok{background:var(--green-dark);color:#fff;border-color:var(--green-dark)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.full{grid-column:1/-1}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.f label em{color:var(--danger);font-style:normal}
.f input,.f select,.f textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.f textarea{min-height:58px;resize:vertical}
.f input:disabled,.f select:disabled,.f textarea:disabled{background:var(--surface-alt);opacity:.85}
.err{color:var(--danger);font-size:12px;margin-top:6px}
.hist{list-style:none;padding:0;margin:0;font-size:13px}
.hist li{padding:8px 0;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:118px 1fr;gap:10px}
.hist time{color:var(--muted);font-size:12px}
.savebar{position:sticky;bottom:calc(-40px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:12px 0;border-top:1px solid var(--line);margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:#1F2022;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:40}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green-wash);padding:24px}
.lcard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--green);border-radius:12px;padding:28px;width:min(440px,100%)}
.lcard h1{font-size:22px;font-weight:800;margin:18px 0 4px}
.lcard p{color:var(--muted);margin:0 0 18px}
.lcard .f{margin-bottom:12px}
.idline{display:flex;gap:10px;align-items:center;background:var(--surface-alt);border-radius:8px;padding:10px;margin-bottom:16px;font-size:13px}
.idline img{width:32px;height:32px;border-radius:50%}
.radio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.radio label{display:flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:14px;color:var(--text);margin:0;cursor:pointer;background:var(--surface)}
.f .radio label input[type="radio"]{width:16px;height:16px;padding:0;margin:0;border:0;accent-color:var(--green-dark);flex:none}
.radio label:has(input:checked){border-color:var(--green-dark);background:var(--green-tint)}
@media (max-width:560px){.fields{grid-template-columns:1fr}.wrap{padding:12px 14px 60px}.hist li{grid-template-columns:1fr}}

.envbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
.envbar.test{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px}
.viewbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 12px}
.sec{margin:20px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{font-size:17px;font-weight:800;margin:0}
.sec .small{font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:0;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.card:hover{background:var(--green-wash)}
.card.KD{border-left-color:var(--green)}.card.RD{border-left-color:var(--muted)}.card.KH{border-left-style:dashed;border-left-color:var(--accent)}
.card .ttl{font-weight:700;font-size:15px}
.card .meta{font-size:12px;color:var(--muted);margin:2px 0 8px}
.card .tk{font-size:13px;margin:3px 0}
.card .foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.mini{display:flex;gap:2px;margin-top:8px}
.mini i{flex:1;height:5px;background:var(--surface-alt)}
.mini i.d{background:var(--green)}.mini i.c{background:var(--green-light)}.mini i.m{outline:1px solid var(--accent-strong)}
.kb{overflow-x:auto;padding-bottom:8px}
.kb .cols{display:grid;grid-template-columns:repeat(11,220px);gap:10px}
.kcol{background:var(--surface-alt);border-radius:10px;padding:10px;min-height:200px;opacity:.6}
.kcol.mine{opacity:1;background:var(--green-wash);outline:2px solid var(--green)}
.kcol h4{margin:0 0 2px;font-size:13px;font-weight:700}
.kcol .kh{margin-bottom:10px}
.kcol .card{padding:9px 10px;margin-bottom:8px}
.kcol .card .ttl{font-size:13px}
.mx{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%;table-layout:fixed;min-width:820px}
.mx th{font-weight:600;color:var(--muted);text-align:center;padding:4px 2px;vertical-align:top;height:46px;font-size:11px;line-height:1.25}
.mx th.mine{color:var(--accent);background:var(--green-tint);border-radius:6px}
.mx th .bn{display:block;font-size:15px;font-weight:800;color:var(--text);line-height:20px;margin-bottom:2px}
.mx td.c{height:40px;text-align:center;border-radius:6px;cursor:pointer;background:var(--surface-alt);font-weight:700}
.mx td.c.done{background:var(--green);color:#fff}
.mx td.c.cur{background:var(--surface);outline:2px solid var(--green);color:var(--accent)}
.mx td.c.part{background:var(--green-tint);color:var(--accent)}
.mx tr.myturn td{background:var(--green-tint)}
.mx tr.myturn td.c.done{background:var(--green)}
.mx tr.myturn td.rn{box-shadow:inset 5px 0 0 var(--green-dark);padding-left:12px}
.mx td.c.cur.mine{background:var(--turn-bg)!important;color:var(--turn-fg);box-shadow:var(--turn-shadow);font-size:18px}
.mx tbody td{height:66px}
.mx td.rn,.mx td.stt{overflow:hidden}
.mx td.rn .l1,.mx td.rn .l2,.mx .sl>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx td.rn .l1{display:flex;gap:6px;align-items:center}.mx td.rn .l1 b{overflow:hidden;text-overflow:ellipsis}
.mx td.rn .flag{margin:0}
.mx .sw{display:flex;align-items:center;gap:6px}.mx .sl{flex:1;min-width:0}
.mail{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:15px;line-height:1;color:var(--accent);padding:0}
.mail:hover{border-color:var(--accent-strong)}.mail.pend{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}
#pop{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow-y:auto;font-size:13px}
#pop[hidden]{display:none}
#pop .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#pop .pi{border-top:1px solid var(--line-soft);padding:7px 0}#pop .pi .h{font-size:12px;color:var(--muted)}
.mx .pct{display:inline-block;background:#1F6FB2;color:#fff;font-weight:700;font-size:12px;padding:0 7px;border-radius:4px;margin-right:4px;line-height:18px}
.turnpill{flex:none;display:inline-block;background:var(--green-dark);color:#fff;font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:999px;margin:2px 0}
.mx tr.myturn td.rn b{color:var(--accent-strong)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--green-wash);border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}

.stitle{font-size:18px;font-weight:800;letter-spacing:-.01em;border-bottom:4px solid var(--green);padding-bottom:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{background:var(--green-tint)}
.nav button[aria-selected="true"]{background:var(--green-dark);color:#fff;font-weight:600}
.cnt{background:var(--green);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.nav button[aria-selected="true"] .cnt{background:#fff;color:var(--green-dark)}
.slabel{font-size:12px;color:var(--muted);margin-bottom:6px}
.rolecol{display:flex;flex-direction:column;gap:4px}
.rolecol button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.rolecol button[aria-pressed="true"]{border-color:var(--green-dark);background:var(--green-tint);color:var(--accent);font-weight:600}
.side .who{align-items:flex-start}
.main{padding:18px 22px 60px;min-width:0}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.duepanel{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--green);border-radius:10px;padding:4px 14px 14px;max-height:calc(100vh - 24px);overflow-y:auto}
.duepanel .cards{grid-template-columns:1fr}
@media (min-width:1151px){
.main.workmode{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:14px}
.main.workmode #status{flex:none}
#tabBody.workmode{flex:1;min-height:0}
#tabBody.workmode .work{height:100%}
#tabBody.workmode .work>section{display:flex;flex-direction:column;min-height:0;height:100%}
#tabBody.workmode .work>section>.scroll{flex:1;min-height:0;overflow:auto;padding-top:0!important}
#tabBody.workmode .mx thead th{position:sticky;top:0;z-index:5;background:var(--surface);box-shadow:0 0 0 3px var(--surface),0 4px 0 var(--surface)}
#tabBody.workmode .mx thead th.mine{background:var(--green-tint)}
#tabBody.workmode .mx td.c.cur{outline:0;box-shadow:inset 0 0 0 2px var(--green)}
#tabBody.workmode .mx td.c.cur.mine{box-shadow:var(--turn-shadow)}
#tabBody.workmode .duepanel{position:static;height:100%;max-height:none;overflow-y:auto}
}
.duepanel .dphead{position:sticky;top:-4px;z-index:3;background:var(--surface);margin:0 -14px 6px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.duepanel .sec h2{font-size:16px}
@media (max-width:1150px){.work{grid-template-columns:1fr}.duepanel{position:static;max-height:none}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line)}.stitle{border:0;padding:0}.nav{flex-direction:row;overflow-x:auto;width:100%}.nav button{white-space:nowrap}.side .grow{display:none}}
.addrow{display:grid;grid-template-columns:1fr 1.3fr 1.5fr 0.9fr 0.9fr auto;gap:10px;align-items:end}
.addrow .f select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.addrow .btn{height:36px}
@media (max-width:900px){.addrow{grid-template-columns:1fr 1fr}}
.ti{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%;min-width:120px}

/* ---------- model ---------- */
function norm(r){
  const tk={};const legacy=r.done||{};
  Object.entries(legacy).forEach(([n,v])=>{if(v===true)tk[n]={legacy:true,doneAt:null};else if(v&&typeof v==="object")tk[n]={doneAt:v.at,doneBy:v.by,startedAt:v.ms!=null?new Date(new Date(v.at)-v.ms).toISOString():v.at}});
  Object.entries(r.tasks||{}).forEach(([n,v])=>{if(v===null)delete tk[n];else tk[n]={...(tk[n]||{}),...v}});
  if(r.tasksReset){Object.keys(tk).forEach(n=>{const v=tk[n];if(v&&v.round!==undefined&&v.round<(r.round||1))delete tk[n]})}
  const g={...(r.gates||{})};
  if(!g.feas&&r.step!=null&&r.step>2)g.feas={result:"yes"};
  if(!g.pass&&r.status==="launched")g.pass={result:"yes"};
  r._t=tk;r._g=g;return r}
const tDone=(r,n)=>{const v=r._t[n];return !!(v&&(v.doneAt||v.legacy))};
function bDone(r,i){const b=B[i];return b.t.every(n=>tDone(r,n))&&(!b.g||(r._g[b.g]&&r._g[b.g].result==="yes"))}
function curBlock(r){for(let i=0;i<B.length;i++)if(!bDone(r,i))return i;return B.length}
function blockDoneAt(r,i){const b=B[i];const ts=b.t.map(n=>r._t[n]&&r._t[n].doneAt).concat(b.g&&r._g[b.g]?[r._g[b.g].at]:[]);if(ts.some(x=>!x))return null;return ts.sort().pop()}
function readyAt(r,i){if(i===0)return r.reqDate?new Date(r.reqDate+"T08:00:00").toISOString():r.createdAt;return blockDoneAt(r,i-1)}
function bState(r,i){if(bDone(r,i))return"done";const c=curBlock(r);if(i===c)return"cur";const b=B[i];if(b.t.some(n=>tDone(r,n)||(r._t[n]&&r._t[n].startedAt)))return"early";return"wait"}
function gateReady(r,i){const b=B[i];return b.g&&b.gNeed.every(n=>tDone(r,n))&&!(r._g[b.g]&&r._g[b.g].result)}
function myOpen(r,d){const out=[];B.forEach((b,i)=>{b.t.forEach(n=>{if(TK[n].d===d&&!tDone(r,n))out.push({n,i})});if(b.g&&b.d===d&&gateReady(r,i))out.push({g:b.g,i})});return out}
function progress(r){const total=Object.keys(TK).length+2;let d=Object.keys(TK).filter(n=>tDone(r,n)).length;["feas","pass"].forEach(g=>{if(r._g[g]&&r._g[g].result==="yes")d++});return Math.round(d/total*100)}
function flags(r){const f=[];if(r.status!=="active")return f;
  if(r.pending)f.push(["bad","Pending"+(r.pendingReason?": "+r.pendingReason:"")]);
  if(!tDone(r,9)&&r.expectedSample&&r.expectedSample<todayS())f.push(["warn","Trễ ngày có mẫu"]);
  if(tDone(r,12)&&!tDone(r,14)&&r.resultExpected&&r.resultExpected<todayS())f.push(["warn","KD cần note phản hồi"]);
  return f}
function entries(r){return [...(Array.isArray(r.history)?r.history:[]),...Object.values(r.log||{})].filter(Boolean).sort((a,b)=>a.at.localeCompare(b.at))}
function comments(r){return Object.values(r.comments||{}).filter(Boolean).sort((a,b)=>a.at.localeCompare(b.at))}
function taskDur(r,n,i){const v=r._t[n];if(!v||!v.doneAt)return null;const st=v.startedAt||readyAt(r,i)||v.doneAt;return new Date(v.doneAt)-new Date(st)}
function blockDur(r,i){const end=blockDoneAt(r,i);if(!end)return null;const b=B[i];const starts=b.t.map(n=>r._t[n]&&r._t[n].startedAt).filter(Boolean);const ra=readyAt(r,i);if(ra)starts.push(ra);if(!starts.length)return null;return new Date(end)-new Date(starts.sort()[0])}
function stats(){const bs={},ts={};rows().forEach(r=>B.forEach((b,i)=>{const d=blockDur(r,i);if(d!=null&&d>=0)(bs[i]=bs[i]||[]).push(d);b.t.forEach(n=>{const x=taskDur(r,n,i);if(x!=null&&x>=0)(ts[n]=ts[n]||[]).push(x)})}));
  const avg=o=>{const a={};Object.keys(o).forEach(k=>a[k]=o[k].reduce((x,y)=>x+y,0)/o[k].length);return a};return {b:avg(bs),t:avg(ts),bn:Object.fromEntries(Object.entries(bs).map(([k,v])=>[k,v.length]))}}
function vis(all){const q=S.q.trim().toLowerCase();return rows().filter(r=>(all||S.showClosed||r.status==="active")&&(!q||[r.customer,r.application,r.productCode,r.salePic,r.rdPic,r.planPic,r.industry,r.lot,nameOf(r.createdBy)].join(" ").toLowerCase().includes(q))).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""))}

function busy(sel,on){const b=$(sel);if(b)b.disabled=on}
async function doLogin(){const em=($("#lg-email")?.value||"").trim().toLowerCase(),pw=$("#lg-pw")?.value||"";S.err="";
  if(!okMail(em)){$("#lg-err").textContent="Nhập email hợp lệ.";return}if(!pw){$("#lg-err").textContent="Nhập mật khẩu.";return}
  busy("[data-act=login]",true);S.email=em;
  const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
  busy("[data-act=login]",false);
  if(error){$("#lg-err").textContent=/invalid/i.test(error.message)?"Email hoặc mật khẩu không đúng. Nếu chưa kích hoạt tài khoản, bấm “Kích hoạt tài khoản”.":errMsg(error)}}
async function doActivate(){const em=($("#ac-email")?.value||"").trim().toLowerCase(),code=($("#ac-code")?.value||"").trim(),pw=$("#ac-pw")?.value||"",pw2=$("#ac-pw2")?.value||"";const el=$("#ac-err");
  const er=!okMail(em)?"Nhập email hợp lệ.":!code?"Nhập mã kích hoạt.":pw.length<8?"Mật khẩu cần ít nhất 8 ký tự.":pw!==pw2?"Hai lần nhập mật khẩu chưa khớp.":"";if(er){el.textContent=er;return}
  busy("[data-act=activate]",true);S.email=em;
  try{const r=await rpc("fn_activate",{p_email:em,p_code:code,p_password:pw});
    if(r==="wrong"){el.textContent="Email hoặc mã kích hoạt không đúng.";return}
    if(r==="need_delete"){el.textContent="Email này đã có tài khoản đăng nhập cũ. Nhờ Owner xóa tài khoản đó trong Supabase (Authentication → Users) rồi kích hoạt lại bằng cùng mã.";return}
    if(r==="login"){const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)el.textContent=errMsg(error);return}
    const {data,error}=await sb.auth.signUp({email:em,password:pw});
    if(error){el.textContent=errMsg(error);return}
    if(!data.session){el.textContent="Supabase đang bật xác nhận email. Owner cần tắt “Confirm email” trong Authentication → Sign In / Providers → Email.";return}
  }catch(e){el.textContent=errMsg(e)}finally{busy("[data-act=activate]",false)}}

document.addEventListener("click",e=>{if(e.target.closest("[data-act=theme]")){toggleTheme();return}const pp=document.getElementById("pop");if(pp&&!pp.hidden&&!e.target.closest("#pop")&&!e.target.closest("[data-note]"))hidePop();
  const t=e.target.closest("button,[data-open],.scrim");if(!t)return;const d=t.dataset;
  if(d.note){showNote(d.note,t);return}if(d.act==="closePop"){hidePop();return}if(t.closest("#pop")&&d.open){hidePop()}
  if(d.tab){S.tab=d.tab;render();return}
  if(d.trole){setActing(d.trole);return}
  if(d.open){openDrawer(d.open,d.block);return}
  if(d.reissue){reissue(d.reissue);return}if(d.approve){approve(d.approve);return}if(d.reject){reject(d.reject);return}if(d.chrole){changeRole(d.chrole);return}if(d.remove){removeMember(d.remove);return}
  const r=rows().find(x=>x.id===S.openId);
  if(d.toggle!==undefined&&r){collect();const i=+d.toggle;const cur=document.querySelector(`[data-toggle="${i}"]`).getAttribute("aria-expanded")==="true";S.expanded[i]=!cur;renderDrawer();return}
  if(d.confirm&&r){confirmTask(r,+d.confirm);return}if(d.undo&&r){undoTask(r,+d.undo);return}if(d.savetask&&r){saveTask(r,+d.savetask);return}
  if(d.gate&&r){if(d.gate==="feas:no"){collect();S.closeMode="feas";renderDrawer();setTimeout(()=>{const t=$("#close-reason");if(t){t.focus();t.scrollIntoView({block:"center"})}},0);return}gate(r,d.gate);return}
  const a=d.act;if(!a)return;
  if(a==="login"){doLogin();return}if(a==="activate"){doActivate();return}
  if(a==="toActivate"){S.email=($("#lg-email")?.value||S.email||"").trim();S.screen="activate";render();return}
  if(a==="toLogin"){S.screen="login";render();return}
  if(a==="copyCode"){try{navigator.clipboard.writeText(S.issued.text)}catch(e){}toast("Đã chép nội dung gửi nhân sự");return}
  if(a==="hideCode"){S.issued=null;renderTab();return}
  if(a==="logout"){closeDrawer();sb.auth.signOut();return}
  if(a==="new"){if(canAct("KD"))openDrawer("new");return}if(a==="closeD"){closeDrawer();return}if(a==="create"){createRow();return}
  if(a==="addManual"){addManual();return}
  if(!r)return;

const vnorm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").toLowerCase().trim();
function initials(n){const w=String(n||"").trim().split(/\s+/).filter(Boolean);return ((w.length>1?w[w.length-2][0]:"")+(w.length?w[w.length-1][0]:"")).toUpperCase()||"?"}
function memberByEmail(e){const x=String(e||"").trim().toLowerCase();if(!x)return null;return Object.values(S.members).find(m=>(m.email||"").toLowerCase()===x&&m.status!=="removed")||null}
function picPeople(dept){return Object.values(S.members).filter(m=>m.dept===dept&&(m.status==="active"||m.status==="invited")&&m.email)
  .sort((a,b)=>(a.displayName||"").localeCompare(b.displayName||"","vi"))
  .map(m=>({name:m.displayName||m.fullName||m.email,full:m.fullName&&m.fullName!==m.displayName?m.fullName:"",email:m.email,dept,acct:m.status==="active"}))}
function picMeta(name,email,dept,ed){const m=memberByEmail(email);
  if(m)return `<span class="pmok">✓ ${esc(m.email)}</span>${m.dept!==dept?` <span class="pmwarn">· thuộc ${esc(DEPT[m.dept]||m.dept)}</span>`:""}${m.status==="invited"?' <span class="pmmut">· chưa đăng nhập</span>':""}`;
  if(email)return `<span class="pmwarn">Email ${esc(email)} không còn trong danh sách tài khoản${ed?" – chọn lại":""}</span>`;
  if(name&&String(name).trim())return ed?`<span class="pmwarn">Chưa gắn tài khoản – chọn người từ danh sách gợi ý</span>`:`<span class="pmmut">Chưa gắn tài khoản</span>`;
  return ""}
const PP={el:null,inp:null,items:[],hl:-1,all:false};
function ppEl(){if(!PP.el){const d=document.createElement("div");d.id="picpop";d.setAttribute("role","listbox");d.hidden=true;document.body.appendChild(d);
  d.addEventListener("mousedown",e=>{e.preventDefault();const o=e.target.closest("[data-pi],[data-pmore]");if(!o)return;if(o.dataset.pmore!==undefined){PP.all=true;ppRender();return}ppPick(+o.dataset.pi)});PP.el=d}return PP.el}
function ppMatch(p,q){return !q||vnorm(p.name).includes(q)||vnorm(p.full).includes(q)||vnorm(p.email).includes(q)}
function ppRender(){const inp=PP.inp;if(!inp)return;const dept=inp.dataset.pic;const q=vnorm(inp.value);const el=ppEl();PP.items=[];
  const row=(p,other)=>{const i=PP.items.push(p)-1;return `<div class="pi ${i===PP.hl?"hl":""}" role="option" id="pi-${i}" data-pi="${i}" aria-selected="${i===PP.hl}"><span class="av ${other?"o":""}">${esc(initials(p.name))}</span><span class="pn"><b>${esc(p.name)}</b><span>${esc([p.full,p.email].filter(Boolean).join(" · "))}</span></span>${other?`<span class="pill d-${p.dept}">${DEPT[p.dept]}</span>`:p.acct?"":`<span class="pt">chưa đăng nhập</span>`}</div>`};
  const mine=picPeople(dept).filter(p=>ppMatch(p,q));
  let h=`<div class="ph">Gợi ý · ${DEPT[dept]}</div>`+(mine.length?mine.map(p=>row(p,false)).join(""):`<div class="pe">${q?"Không có ai khớp trong "+DEPT[dept]:"Chưa có nhân sự "+DEPT[dept]+" trong Quản trị người dùng"}</div>`);
  if(PP.all||q){Object.keys(DEPT).filter(d=>d!==dept).forEach(d=>{const o=picPeople(d).filter(p=>ppMatch(p,q));if(o.length)h+=`<div class="ph sep">Phòng ban khác · ${DEPT[d]}</div>`+o.map(p=>row(p,true)).join("")})}
  else h+=`<div class="pmore" data-pmore>Chọn người phòng ban khác</div>`;
  el.innerHTML=h;el.hidden=false;inp.setAttribute("aria-expanded","true");if(PP.hl>=0)inp.setAttribute("aria-activedescendant","pi-"+PP.hl);else inp.removeAttribute("aria-activedescendant");ppPlace()}
function ppPlace(){if(!PP.inp||!PP.el||PP.el.hidden)return;const r=PP.inp.getBoundingClientRect();if(!r.width){ppHide();return}const el=PP.el;el.style.left=r.left+"px";el.style.width=Math.max(r.width,260)+"px";
  const below=window.innerHeight-r.bottom-12,above=r.top-12;const h=Math.min(el.scrollHeight,300);
  if(below<h&&above>below){el.style.top="";el.style.bottom=(window.innerHeight-r.top+4)+"px";el.style.maxHeight=Math.min(300,above)+"px"}else{el.style.bottom="";el.style.top=(r.bottom+4)+"px";el.style.maxHeight=Math.max(120,Math.min(300,below))+"px"}}
function ppOpen(inp){PP.inp=inp;PP.hl=-1;PP.all=false;ppRender()}
function ppHide(){if(PP.el)PP.el.hidden=true;if(PP.inp){PP.inp.setAttribute("aria-expanded","false");PP.inp.removeAttribute("aria-activedescendant")}PP.inp=null}
function picHidden(inp){return document.getElementById("f-"+inp.dataset.k+"Email")}
function ppWarn(inp){const h=picHidden(inp);const w=document.getElementById("pm-"+inp.dataset.k);if(w)w.innerHTML=picMeta(inp.value,h?h.value:"",inp.dataset.pic,true)}
function picLink(inp,p){const h=picHidden(inp);inp.value=p.name;if(h)h.value=p.email;S.draft[inp.dataset.k]=p.name;S.draft[inp.dataset.k+"Email"]=p.email;ppWarn(inp)}
/* Rời ô mà chưa chọn: tự gắn nếu gõ đúng email hoặc tên chỉ khớp đúng một tài khoản */
function picAuto(inp){const h=picHidden(inp);if(!h||h.value||!inp.value.trim())return;const q=vnorm(inp.value);
  const all=Object.keys(DEPT).flatMap(d=>picPeople(d));const hit=all.filter(p=>vnorm(p.email)===q||vnorm(p.name)===q||vnorm(p.full)===q);
  if(hit.length===1)picLink(inp,hit[0])}
function ppPick(i){const p=PP.items[i];const inp=PP.inp;if(!p||!inp)return;picLink(inp,p);ppHide()}
document.addEventListener("focusin",e=>{const t=e.target;if(t.matches&&t.matches("input[data-pic]:not(:disabled)"))ppOpen(t)});
document.addEventListener("focusout",e=>{const t=e.target;if(!(t.matches&&t.matches("input[data-pic]")))return;picAuto(t);ppWarn(t);if(t===PP.inp)setTimeout(()=>{if(document.activeElement!==PP.inp)ppHide()},0)});
document.addEventListener("input",e=>{if(e.target.matches&&e.target.matches("input[data-pic]")){if(PP.inp!==e.target)PP.inp=e.target;PP.hl=-1;const h=picHidden(e.target);if(h)h.value="";S.draft[e.target.dataset.k+"Email"]="";ppRender();const w=document.getElementById("pm-"+e.target.dataset.k);if(w)w.innerHTML=""}});
document.addEventListener("keydown",e=>{if(!PP.inp||e.target!==PP.inp||!PP.el||PP.el.hidden){if(e.key==="ArrowDown"&&e.target.matches&&e.target.matches("input[data-pic]:not(:disabled)")){ppOpen(e.target);e.preventDefault()}return}
  const n=PP.items.length;
  if(e.key==="ArrowDown"){PP.hl=n?(PP.hl+1)%n:-1;ppRender();document.getElementById("pi-"+PP.hl)?.scrollIntoView({block:"nearest"});e.preventDefault()}
  else if(e.key==="ArrowUp"){PP.hl=n?(PP.hl<=0?n-1:PP.hl-1):-1;ppRender();document.getElementById("pi-"+PP.hl)?.scrollIntoView({block:"nearest"});e.preventDefault()}
  else if(e.key==="Enter"&&PP.hl>=0){ppPick(PP.hl);e.preventDefault();e.stopPropagation()}
  else if(e.key==="Escape"){ppHide();e.preventDefault();e.stopPropagation()}
  else if(e.key==="Tab")ppHide()},true);

/* ---------- nhập phiếu iForm (.docx) ---------- */
// File Word được đọc ngay trên trình duyệt (JSZip + DOMParser), không gửi đi đâu.
const JSZIP_URL="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
const IF_LBL={"ho va ten":"reqName","vi tri cong viec":"_","cong ty":"_","khoi/phong ban":"_","ma nhan vien":"reqCode","email":"reqEmail",
  "ma phieu xuat kho":"slip","ma san pham":"productCode","don vi chiu phi vc":"freightPayer","phi van chuyen":"freightFee",
  "ten khach hang":"customer","thong tin lien lac khach hang":"contact","thi truong":"market","thong tin them":"moreInfo",
  "dong san pham":"productLine","so luong":"qty","cong nghe san xuat":"tech","ung dung san pham":"application",
  "mau sac":"color","mau chuan":"sample","khach hang co kinh nghiem san xuat nhua tai che":"recExp","thoi gian cung cap mau":"supplyTime",
  "ty le su dung":"usage","ma nhua nguyen sinh khach hang dang su dung":"virgin","yeu cau ve cac chung nhan":"cert",
  "ma nhua tai che khach hang dang su dung":"recCode","yeu cau ky thuat":"techReq","don vi gia cong tai viet nam":"processor",
  "san luong du kien hang thang":"monthly","muc gia du kien khach hang chap nhan":"price","thoi gian can cung cap mau":"needDate",
  "thoi gian tung hang":"launch","yeu cau khac":"otherReq","muc dich gui mau":"purpose"};
const IF_GROUPS=[
  ["Sản phẩm & kỹ thuật","box",[["productCode","Mã sản phẩm"],["color","Màu sắc"],["sample","Mẫu chuẩn"],["techReq","Yêu cầu kỹ thuật"],["cert","Chứng nhận"]]],
  ["Khách hàng","building-factory-2",[["market","Thị trường"],["contact","Liên lạc KH"],["moreInfo","Thông tin thêm"],["processor","Đơn vị gia công"],["recExp","Đã dùng nhựa tái chế"],["virgin","Nhựa nguyên sinh đang dùng"],["recCode","Nhựa tái chế đang dùng"],["purpose","Mục đích trên iForm"]]],
  ["Sản lượng & giá","chart-bar",[["qtyTxt","Số lượng mẫu"],["usage","Tỷ lệ sử dụng"],["monthly","Sản lượng / tháng"],["price","Mức giá KH chấp nhận"]]],
  ["Thời gian & vận chuyển","truck",[["needDate","Cần mẫu"],["supplyTime","Thời gian cung cấp mẫu"],["launch","Tung hàng dự kiến"],["freight","Phí vận chuyển"],["slip","Phiếu xuất kho"],["otherReq","Yêu cầu khác"]]]];
const ifLabelKey=t=>IF_LBL[vnorm(t).replace(/\([^)]*\)/g,"").replace(/[:：]/g,"").replace(/\s+/g," ").trim()];
const ifDate=t=>{const m=String(t||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:""};
const ifNum=t=>{let x=String(t||"").trim().replace(/\s/g,"");if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(x))x=x.replace(/\./g,"");x=x.replace(",",".");const n=parseFloat(x);return isFinite(n)?String(n):""};
function loadScriptOnce(src){return new Promise((ok,bad)=>{if(window.JSZip)return ok();const el=document.createElement("script");el.src=src;el.onload=()=>ok();el.onerror=()=>bad(new Error("Không tải được thư viện đọc file Word. Kiểm tra kết nối mạng rồi thử lại."));document.head.appendChild(el)})}
// Đọc chữ của một ô bảng: mỗi đoạn một dòng
function ifCellText(tc){const ps=[...tc.getElementsByTagName("w:p")];return ps.map(p=>{let t="";
  const walk=n=>{for(const c of n.childNodes){if(c.nodeName==="w:t")t+=c.textContent;else if(c.nodeName==="w:tab")t+=" ";else if(c.nodeName==="w:br")t+="\n";else if(c.nodeName!=="w:tbl")walk(c)}};walk(p);return t.trim()}).filter(Boolean).join("\n")}
function parseIformXml(xml){const doc=new DOMParser().parseFromString(xml,"application/xml");if(doc.getElementsByTagName("parsererror").length)throw new Error("File Word bị lỗi, không đọc được.");
  const rows=[];[...doc.getElementsByTagName("w:tr")].forEach(tr=>{const cells=[...tr.childNodes].filter(c=>c.nodeName==="w:tc").map(ifCellText);rows.push(cells)});
  const all=rows.map(r=>r.join(" | ")).join("\n");
  if(!/PHI[ẾE]U\s+Đ[ỀE]\s+XU[ẤA]T\s+G[ỬU]I\s+M[ẪA]U/i.test(all)&&!/iForm\s+s[ốo]/i.test(all))throw new Error("File này không giống phiếu đề xuất gửi mẫu xuất từ iForm.");
  const v={};
  const no=all.match(/Phi[ếe]u\s+iForm\s+s[ốo]\s*:?\s*(\d{5,})/i);if(no)v.no=no[1];
  const dt=all.match(/Ng[àa]y\s*:\s*(\d{1,2}\/\d{1,2}\/\d{4})/i);if(dt)v.date=dt[1];
  for(const cells of rows){const line=cells.join(" ");if(/^Th[ôo]ng tin ph[êe] duy[ệe]t/i.test(line.trim()))break;
    cells.forEach(c=>{const m=c.match(/^Th[ôo]ng tin y[êe]u c[ầa]u chi ti[ếe]t\s*:\s*([\s\S]*)$/i);if(m)v.detail=m[1].replace(/\s+/g," ").trim()});
    const ne=cells.filter(c=>c!=="");
    for(let i=0;i<ne.length;i++){const key=ifLabelKey(ne[i]);if(!key)continue;const nx=ne[i+1];
      if(nx!==undefined&&!ifLabelKey(nx)){if(key!=="_")v[key]=nx.replace(/\s*\n\s*/g," ").trim();i++}else if(key!=="_")v[key]=""}}
  return v}
function ifIndustry(line,tech){const l=vnorm(line).replace(/\s/g,""),t=vnorm(tech);const ep=/\bep\b|injection/.test(t),thoi=/\bthoi\b|blow/.test(t);
  if(l.startsWith("rpp"))return ep?"rPP ép":"rPP";
  if(l.startsWith("rhdpe"))return thoi?"rHDPE thổi":ep?"rHDPE ép":"";
  if(l.startsWith("rpet"))return /soi|fiber|xo/.test(t)?"rPET xơ sợi":"";
  return ""}
function ifBuildDetail(v,fileName){const x={...v,qtyTxt:v.qty?`${v.qty} kg`:"",freight:[v.freightPayer,v.freightFee].filter(Boolean).join(" · ")};
  return {no:v.no||"",date:v.date||"",requester:{name:v.reqName||"",email:v.reqEmail||"",code:v.reqCode||""},detail:v.detail||"",file:fileName||"",importedAt:new Date().toISOString(),
    groups:IF_GROUPS.map(([t,ic,items])=>({t,ic,items:items.map(([k,l])=>[l,x[k]||""]).filter(([,val])=>String(val).trim())})).filter(g=>g.items.length)}}
async function importIform(file){const zone=document.getElementById("ifmsg");const say=(t,bad)=>{if(zone){zone.textContent=t;zone.className="ifmsg"+(bad?" bad":"")}};
  if(!file)return;if(!/\.docx$/i.test(file.name)){say("Chỉ nhận file Word .docx xuất từ iForm.",true);return}
  if(file.size>15*1024*1024){say("File quá lớn (tối đa 15 MB).",true);return}
  say("Đang đọc file…");
  try{await loadScriptOnce(JSZIP_URL);const zip=await window.JSZip.loadAsync(file);const ent=zip.file("word/document.xml");if(!ent)throw new Error("Không tìm thấy nội dung trong file Word.");
    const v=parseIformXml(await ent.async("string"));applyIform(v,file.name)}
  catch(e){say(e.message||"Không đọc được file.",true)}}
function applyIform(v,fileName){collect();const D=S.draft,filled=new Set();const set=(k,val)=>{if(val!==undefined&&String(val).trim()!==""){D[k]=String(val).trim();filled.add(k)}};
  set("iform",v.no);set("reqDate",ifDate(v.date));set("customer",v.customer);set("application",v.application);
  const ind=ifIndustry(v.productLine,v.tech);if(ind)set("industry",ind);
  set("qty",ifNum(v.qty));
  if(v.detail){const cur=String(D.requirement||"").trim();D.requirement=cur&&!cur.includes(v.detail)?v.detail+"\n"+cur:(cur||v.detail+"\n");filled.add("requirement")}
  let emailMiss="";const m=memberByEmail(v.reqEmail);
  if(m&&m.status!=="removed"){D.salePic=m.displayName;D.salePicEmail=m.email;filled.add("salePic")}else if(v.reqEmail)emailMiss=v.reqEmail;
  D.purpose="";D.iformDetail=ifBuildDetail(v,fileName);
  const dup=v.no?rows().find(r=>r.iform===v.no):null;
  S.ifFilled=filled;S.ifDupAck=false;S.ifInfo={no:v.no||"",count:filled.size,purpose:v.purpose||"",emailMiss,requester:v.reqName||"",dup:dup?[dup.customer,dup.application].filter(Boolean).join(" – "):"",industryRaw:ind?"":[v.productLine,v.tech].filter(Boolean).join(" · ")};
  renderDrawer();toast(`Đã nhập phiếu iForm ${v.no||""}`)}
function ifCls(k){return S.openId==="new"&&S.ifFilled&&S.ifFilled.has(k)?"iffill":""}
function ifZone(){const I=S.ifInfo;
  if(!I)return `<div class="ifzone" id="ifzone"><div class="ifz-ic" aria-hidden="true">W</div><div class="ifz-t"><b>Nhập từ phiếu iForm</b><span>Kéo thả file Word (.docx) xuất từ iForm vào đây để tự điền bước 1</span><div class="ifmsg" id="ifmsg" role="status"></div></div><button class="btn sm" data-act="ifPick">Chọn file .docx</button><input type="file" id="iffile" accept=".docx" hidden></div>`;
  return `<div class="ifok" role="status"><div><b>Đã nhập phiếu iForm ${esc(I.no||"(không rõ số)")}</b> – điền ${I.count} ô (nền xanh, nhãn “iForm”). Kiểm tra lại trước khi tạo hồ sơ.
    ${I.requester?`<br><span class="small">Người lập phiếu: ${esc(I.requester)}</span>`:""}
    ${I.emailMiss?`<br><span class="ifw">PIC Sale: email ${esc(I.emailMiss)} chưa có trong Quản trị người dùng – chọn PIC bằng tay.</span>`:""}
    ${I.industryRaw?`<br><span class="ifw">Ngành: iForm ghi “${esc(I.industryRaw)}” – chọn ngành phù hợp.</span>`:""}
    ${I.dup?`<br><span class="ifw">Phiếu này đã có hồ sơ “${esc(I.dup)}”.</span>`:""}
    <div class="ifmsg" id="ifmsg" role="status"></div></div><button class="btn sm" data-act="ifPick">Chọn file khác</button><input type="file" id="iffile" accept=".docx" hidden></div>`}
function iformBlock(d,open){if(!d||!d.groups)return "";const n=d.groups.reduce((a,g)=>a+g.items.length,0);
  return `<details class="ifblk" ${open?"open":""}><summary><span>Chi tiết từ phiếu iForm${d.no?" "+esc(d.no):""}</span><span class="small"> · ${n} mục · chỉ đọc${d.date?" · ngày "+esc(d.date):""}</span></summary>
  ${d.requester&&(d.requester.name||d.requester.email)?`<div class="ifreq">Người lập: ${esc(d.requester.name||"")}${d.requester.email?" · "+esc(d.requester.email):""}</div>`:""}
  <div class="ifgrid">${d.groups.map(g=>`<div class="ifg"><div class="ifgt">${esc(g.t)}</div><dl>${g.items.map(([l,v])=>`<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></div>`).join("")}</div></details>`}

  sb.auth.onAuthStateChange((ev,session)=>{S.session=session;
    if(ev==="SIGNED_OUT"){S.me=null;S.uid=null;S.rowsReal=[];if(chan){sb.removeChannel(chan);chan=null}S.screen="login";render()}
    else if((ev==="SIGNED_IN"||ev==="INITIAL_SESSION")&&session&&S.screen!=="main"){setTimeout(afterLogin,0)}
    else if(ev==="INITIAL_SESSION"&&!session){S.screen="login";render()}});
})();

</script>
